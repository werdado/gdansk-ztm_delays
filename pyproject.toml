[project]
name = "ztm-viz"
version = "0.1.0"
description = "Wizualizacja opóźnień ZTM Gdańsk z archiwalnego GPS (raport statyczny HTML)"
authors = [
    { name = "kubamarchwicki", email = "kuba@marchwicki.pl" }
]
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
]

[project.scripts]
ztm-viz = "ztm_viz:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
